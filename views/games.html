<section id="games" data-label="E · Game library">
  <div class="wrap">

    <p class="g-meta" id="g-meta" aria-live="polite"></p>
    <div class="games" id="g-list" data-label="E2 · Game list"></div>
    <button class="btn btn-ghost" type="button" id="g-more" style="margin-top:20px" data-label="E3 · Button"></button>
  </div>
